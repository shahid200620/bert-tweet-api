services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentiment-api
    environment:
      MODEL_PATH: /app/model_output
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sentiment-ui
    environment:
      API_URL: http://api:8000
      UI_PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s